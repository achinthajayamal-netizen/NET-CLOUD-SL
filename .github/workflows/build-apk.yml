name: Build NET CLOUD SL APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install SDK/NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install gomobile
        run: |
          export GOBIN="$HOME/.local/bin"
          mkdir -p "$GOBIN"
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          command -v gomobile
          gomobile version

      - name: Build libXray AAR
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v gomobile
          gomobile version
          git clone --depth 1 https://github.com/XTLS/libXray.git native/libXray
          python3 native/libXray/build/main.py android
          AAR=$(find native/libXray -type f -name '*.aar' | head -n1)
          test -n "$AAR"
          cp "$AAR" app/libs/libXray.aar
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NET-CLOUD-SL-debug
          path: app/build/outputs/apk/debug/*.apk
